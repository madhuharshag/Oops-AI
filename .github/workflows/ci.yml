name: CI & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Gitleaks Secrets Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Server Dependencies
        run: npm ci --prefix server || npm install --prefix server

      - name: Install Client Dependencies
        run: npm ci --prefix client || npm install --prefix client

      - name: Dependency Vulnerability Audit
        run: |
          npm audit --audit-level=high || true
          npm audit --prefix server --audit-level=high || true
          npm audit --prefix client --audit-level=high || true

      - name: Typecheck & Lint
        run: npm run lint

      - name: Run Test Suite
        run: npm run test

      - name: Build Production Bundles
        run: npm run build
